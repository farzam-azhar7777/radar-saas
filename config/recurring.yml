# PollTickJob decides for itself whether a poll is due. Ticking every minute
# keeps the real cadence (jittered, day/night aware) in Ruby where it belongs.
development: &schedule
  poll_tick:
    class: PollTickJob
    queue: default
    schedule: every minute

production:
  <<: *schedule
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
